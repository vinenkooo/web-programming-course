services:
  db:
    image: postgres:16-alpine
    env_file: [.env]
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-quiz-backend:local}
    build: .
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
    ports: ["3000:3000"]
    command: sh -c "npx prisma migrate deploy && node dist/src/index.js"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
